<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <title>Ejercicio 3</title>
        <meta charset="utf-8">
        <style>
            .azul {
                background-color: rgb(140, 147, 243);
            }
            .verde {
                background-color: lightgreen;
            }
            .verdeclaro {
                background-color: rgb(182, 250, 182);
            }
            .rojo {
                background-color: rgb(248, 119, 119);
            }
            .rojoclaro {
                background-color: rgb(253, 158, 158);
            }
        </style>
    </head>
    <body>
        <table border="solid 1px grey">
            <tr>
                <th rowspan="2" class="azul">Grupos de Edades</th>
                <th colspan="2" class="verde">Hombres</th>
                <th colspan="2" class="rojo">Mujeres</th>
            </tr>
            <tr>
               <th class="verde">Num</th>
               <th class="verdeclaro">%</th>
               <th class="rojo">Num</th>
               <th class="rojoclaro">%</th> 
            </tr>
            <tr>
                <th class="azul">8 - 16</th>
                <td class="verde">16</td>
                <td class="verdeclaro">14.5</td>
                <td class="rojo">10</td>
                <td class="rojoclaro">9</td>
            </tr>
            <tr>
                <th class="azul">17 - 23</th>
                <td class="verde">8</td>
                <td class="verdeclaro">7</td>
                <td class="rojo">13</td>
                <td class="rojoclaro">11.5</td>
            </tr>
            <tr>
                <th class="azul">24 - 38</th>
                <td class="verde">15</td>
                <td class="verdeclaro">14</td>
                <td class="rojo">8</td>
                <td class="rojoclaro">7</td>
            </tr>
            <tr>
                <th class="azul">39 - 56</th>
                <td class="verde">21</td>
                <td class="verdeclaro">19</td>
                <td class="rojo">19</td>
                <td class="rojoclaro">17</td>
            </tr>
        </table>
    </body>
</html>
